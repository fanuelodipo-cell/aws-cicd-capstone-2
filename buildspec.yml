
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "eu-west-2"
    ECR_REPOSITORY_NAME: "myapp-repo"
    IMAGE_TAG: "latest"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing application dependencies"
      - npm ci

  pre_build:
    commands:
      - echo "Running automated tests"
      - npm test
      - echo "Logging in to Amazon ECR"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Building Docker image"
      - docker build -t $ECR_REPOSITORY_NAME:$IMAGE_TAG .
      - docker tag $ECR_REPOSITORY_NAME:$IMAGE_TAG $ECR_URI:$IMAGE_TAG

  
  post_build:
    commands:
      - echo "Pushing Docker image to Amazon ECR"
      - docker push $ECR_URI:$IMAGE_TAG
      - printf '{"ImageURI":"%s"}' "$ECR_URI:$IMAGE_TAG" > imageDetail.json
      - echo "Build and push completed"

artifacts:
  files:
    - imageDetail.json
    - appspec.yml
    - taskdef.json
